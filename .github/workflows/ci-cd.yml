name: CI/CD

# Пайплайн: changes → lint → build-image (один раз) → tests / coverage /
# smoke (параллельно, образ из артефакта) → publish в GHCR (только main)
# → GitHub Release (только main).
# Образ собирается ровно один раз: остальные job'ы скачивают tar-артефакт,
# поэтому публикация не пересобирает 16 ГБ заново.
on:
  push:
    branches:
      - main
      - jazzy_cpp
      - feat/rust-full-migration
      - 'feat/rust-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: jazzy
  DOCKER_DIR: src/docker
  IMAGE_BASENAME: walking_robot_sim

permissions:
  contents: read

jobs:
  # ════════════════════════════════════════════════════════════
  # 0. CHANGES — не гоняем 16-ГБ сборку на правках документации
  # ════════════════════════════════════════════════════════════
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "")
          echo "changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(src/|scripts/|makefiles/|compose\.yml|compose\.[a-z]+\.yml|Makefile|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ════════════════════════════════════════════════════════════
  # 1. LINT — быстрый статический анализ (advisory, не блокирует)
  # ════════════════════════════════════════════════════════════
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ruff-долг (214 pre-existing ошибок в src/) не должен блокировать
    # автотесты и релиз: job остаётся в отчёте, но не валит пайплайн.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install yamllint ruff

      - name: YAML lint (workflows + compose)
        run: |
          echo "=== Checking .github/workflows ==="
          yamllint -c .yamllint .github/workflows/
          echo "=== Checking src/docker ==="
          yamllint -c .yamllint src/docker/*.yml

      - name: Python lint (ruff)
        run: ruff check src/

      - name: Dockerfile lint (hadolint)
        continue-on-error: true
        run: docker run --rm -i hadolint/hadolint < src/docker/Dockerfile

      - name: Shell lint (shellcheck)
        continue-on-error: true
        run: shellcheck scripts/*.sh

  # ════════════════════════════════════════════════════════════
  # 2. BUILD-IMAGE — единственная сборка образа; образ уходит артефактом
  # ════════════════════════════════════════════════════════════
  build-image:
    name: Build image (once)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -f src/docker/Dockerfile -t walking_robot_sim:latest .

      - name: Save image archive (zstd)
        run: make image-save SAVE_IMAGE=1

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: |
            images/walking_robot_sim-latest-*.tar.zst
            images/walking_robot_sim-latest-*.tar.zst.sha256
          retention-days: 3
          compression-level: 0

  # ════════════════════════════════════════════════════════════
  # 3. TESTS — Rust unit + golden cross-val + integration
  # ════════════════════════════════════════════════════════════
  tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-image]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: images

      - name: Load image
        run: make image-load

      - name: Start container
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose up -d

      - name: Wait for workspace
        run: |
          cd ${{ env.DOCKER_DIR }}
          echo "Waiting for workspace (max 60s)..."
          for i in $(seq 1 30); do
            if docker compose exec -T simulator bash -c \
              "source /opt/ros/jazzy/setup.bash && source /root/ws/install/setup.bash 2>/dev/null && ros2 node list" 2>/dev/null | grep -q .; then
              echo "Workspace ready at ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "WARNING: Workspace not ready, continuing anyway"

      - name: Build Rust workspace
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose exec -T simulator bash -c "
            source /opt/ros/jazzy/setup.bash
            source /root/ws/install/setup.bash 2>/dev/null || true
            cd /root/ws/src/quadropted_controller_rust
            cargo build --workspace"

      - name: Rust tests (unit + golden cross-validation + integration)
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose exec -T simulator bash -c "
            source /opt/ros/jazzy/setup.bash
            source /root/ws/install/setup.bash 2>/dev/null || true
            cd /root/ws/src/quadropted_controller_rust
            cargo test --workspace"

      - name: Cleanup
        if: always()
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose down -v --remove-orphans

  # ════════════════════════════════════════════════════════════
  # 4. COVERAGE — llvm-cov, порог 90% строк, отчёт артефактом
  # ════════════════════════════════════════════════════════════
  coverage:
    name: Coverage (≥ 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-image]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: images

      - name: Load image
        run: make image-load

      - name: Start container
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose up -d

      - name: Wait for workspace
        run: |
          cd ${{ env.DOCKER_DIR }}
          for i in $(seq 1 30); do
            if docker compose exec -T simulator bash -c \
              "source /opt/ros/jazzy/setup.bash && source /root/ws/install/setup.bash 2>/dev/null && ros2 node list" 2>/dev/null | grep -q .; then
              echo "Workspace ready at ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "WARNING: Workspace not ready, continuing anyway"

      - name: Install llvm-tools-preview and cargo-llvm-cov
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose exec -T simulator bash -c "
            source /root/.cargo/env
            rustup component add llvm-tools-preview
            cargo install cargo-llvm-cov --locked"

      - name: Coverage gate (≥ 90% lines for the whole workspace)
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose exec -T simulator bash -c "
            set -o pipefail
            source /opt/ros/jazzy/setup.bash
            source /root/ws/install/setup.bash 2>/dev/null || true
            source /root/.cargo/env
            cd /root/ws/src/quadropted_controller_rust
            rm -rf /tmp/wrs-coverage && mkdir -p /tmp/wrs-coverage
            cargo llvm-cov --workspace --lcov --output-path /tmp/wrs-coverage/lcov.info
            cargo llvm-cov report --html --output-dir /tmp/wrs-coverage/html
            cargo llvm-cov report --cobertura --output-path /tmp/wrs-coverage/cobertura.xml
            cargo llvm-cov report --summary-only --fail-under-lines 90 | tee /tmp/wrs-coverage/summary.txt"

      - name: Extract coverage report
        if: always()
        run: |
          cid=$(cd ${{ env.DOCKER_DIR }} && docker compose ps -q simulator)
          mkdir -p "${{ github.workspace }}/reports/coverage"
          docker cp "$cid":/tmp/wrs-coverage/. "${{ github.workspace }}/reports/coverage/" || true
          ls -la "${{ github.workspace }}/reports/coverage" || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage
          path: reports/coverage/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose down -v --remove-orphans

  # ════════════════════════════════════════════════════════════
  # 5. SMOKE — запуск симуляции: узлы, топики, режимы, скорость
  # ════════════════════════════════════════════════════════════
  smoke:
    name: Docker Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-image]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: images

      - name: Load image
        run: make image-load

      - name: Start container
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose up -d

      - name: Ensure workspace volume is complete
        # В CI named volume иногда создаётся неполным (без target/ и Cargo.lock),
        # из-за чего symlink'и install/ на /root/ws/src/.../target/release
        # висят, и ros2 launch падает с "executable ... not found".
        # Если target отсутствует — докопируем /root/ws/src из образа в volume.
        run: |
          cd ${{ env.DOCKER_DIR }}
          if docker compose exec -T simulator bash -lc 'test -f /root/ws/src/quadropted_controller_rust/target/release/robot_controller_node'; then
            echo "Workspace volume: target уже на месте"
          else
            VOL=$(docker inspect walking_robot_sim \
              --format '{{range .Mounts}}{{if eq .Destination "/root/ws/src"}}{{.Name}}{{end}}{{end}}')
            echo "Workspace volume: $VOL неполный — копируем /root/ws/src из образа"
            docker compose exec -T simulator bash -lc \
              'ls -la /root/ws/src/quadropted_controller_rust/ || true'
            docker run --rm -v "${VOL}:/dst" walking_robot_sim:latest \
              bash -c 'cp -a /root/ws/src/. /dst/'
            echo "Workspace volume: содержимое образа скопировано"
          fi
          NODE=/root/ws/install/quadropted_controller_rust/lib/quadropted_controller_rust/robot_controller_node
          if docker compose exec -T simulator bash -lc "test -x $NODE"; then
            echo "Rust nodes: OK"
          else
            echo "Rust nodes: всё ещё MISSING"
            docker compose exec -T simulator bash -lc \
              "ls -l /root/ws/install/quadropted_controller_rust/lib/quadropted_controller_rust/ || true; \
               ls /root/ws/src/quadropted_controller_rust/ || true"
            exit 1
          fi

      - name: Launch simulation (headless, flat world)
        # flat.world не требует загрузки моделей из Fuel — smoke-тест
        # не зависит от внешней сети и стартует за десятки секунд.
        # На github-раннере нет GPU: включаем софтверный GL для Gazebo,
        # а весь вывод launch пишем в файл для диагностики.
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose exec -d simulator bash -lc '
            source /opt/ros/jazzy/setup.bash
            source /root/ws/install/setup.bash
            export LIBGL_ALWAYS_SOFTWARE=1
            export GALLIUM_DRIVER=llvmpipe
            ros2 launch gazebo_sim launch.launch.py \
              use_sim_time:=true gui:=false enable_rviz:=false world:=flat.world \
              > /tmp/smoke_launch.log 2>&1'

      - name: Wait for simulation (clock + nodes)
        id: wait_ros
        run: |
          cd ${{ env.DOCKER_DIR }}
          echo "Waiting for /clock and ROS nodes (max 180s)..."
          for i in $(seq 1 90); do
            if docker compose exec -T simulator bash -c \
              "source /opt/ros/jazzy/setup.bash && \
               source /root/ws/install/setup.bash 2>/dev/null && \
               timeout 3 ros2 topic echo /clock --once >/dev/null 2>&1 && \
               ros2 node list" 2>/dev/null | grep -qi robot; then
              echo "Simulation ready at ~$((i * 2))s"
              docker compose exec -T simulator bash -c \
                "source /opt/ros/jazzy/setup.bash && source /root/ws/install/setup.bash 2>/dev/null && ros2 node list" \
                > ros_nodes.txt 2>&1
              cat ros_nodes.txt
              exit 0
            fi
            sleep 2
          done
          echo "Simulation not ready after 180s"
          echo "--- smoke_launch.log (tail) ---"
          docker compose exec -T simulator bash -lc 'tail -120 /tmp/smoke_launch.log' || true
          echo "--- процессы ---"
          docker compose exec -T simulator bash -lc 'ps -eo pid,args | grep -E "gz sim|ros2 launch|robot_controller|controller_manager" | grep -v grep | head -10' || true
          echo "--- compose ps ---"
          docker compose ps || true
          echo "--- container logs ---"
          docker compose logs --tail=80 simulator || true
          exit 1

      - name: Check critical nodes
        continue-on-error: true
        run: |
          cd ${{ env.DOCKER_DIR }}
          nodes=$(cat ros_nodes.txt)
          for pattern in "robot_controller" "odometry" "cmd_vel"; do
            if echo "$nodes" | grep -qi "$pattern"; then
              echo "✓ Found node: $pattern"
            else
              echo "✗ Missing node: $pattern"
            fi
          done

      - name: Check critical topics
        continue-on-error: true
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose exec -T simulator bash -c "
            source /opt/ros/jazzy/setup.bash
            source /root/ws/install/setup.bash
            ros2 topic list
          " > topics.txt 2>&1
          cat topics.txt
          for topic in "/robot1/joint_states" "/robot1/odom" "/robot1/imu" "/robot1/robot_mode"; do
            if grep -q "$topic" topics.txt; then
              echo "✓ Topic: $topic"
            else
              echo "✗ Missing topic: $topic"
            fi
          done

      - name: Test behavior state switching
        continue-on-error: true
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose exec -T simulator bash -c "
            source /opt/ros/jazzy/setup.bash
            source /root/ws/install/setup.bash
            for mode in TROT CRAWL STAND REST; do
              echo \"=== Test: robot_mode → $mode ===\"
              ros2 topic pub --once /robot1/robot_mode quadropted_msgs/msg/RobotModeCommand \"{mode: $mode, robot_id: 1}\"
              sleep 1
            done
            echo 'All behavior state switches completed'"

      - name: Test velocity command
        continue-on-error: true
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose exec -T simulator bash -c "
            source /opt/ros/jazzy/setup.bash
            source /root/ws/install/setup.bash
            timeout 5s ros2 topic pub /robot1/cmd_vel geometry_msgs/msg/Twist \
              '{linear: {x: 0.0, y: 0.0, z: 0.0}, angular: {x: 0.0, y: 0.0, z: 0.0}}' || true
            sleep 1
            timeout 5s ros2 topic echo /robot1/robot_velocity --once || echo 'robot_velocity topic timeout'"

      - name: Cleanup
        if: always()
        run: |
          cd ${{ env.DOCKER_DIR }}
          docker compose down -v --remove-orphans
          docker system prune -f

      - name: Upload smoke results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: |
            src/docker/ros_nodes.txt
            src/docker/topics.txt
          retention-days: 3

  # ════════════════════════════════════════════════════════════
  # 6. PUBLISH — публикация уже собранного образа в GHCR (только main)
  # ════════════════════════════════════════════════════════════
  publish:
    name: Publish image to GHCR (main)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [tests, coverage, smoke]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: images

      - name: Load image
        run: make image-load

      - name: Compute image name (lowercase)
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        id: push
        run: |
          IMAGE="${{ steps.vars.outputs.image }}"
          VERSION="v0.1.${{ github.run_number }}"
          for tag in latest "${GITHUB_SHA}" "${VERSION}"; do
            docker tag walking_robot_sim:latest "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:latest")
          echo "digest=${DIGEST#*@}" >> "$GITHUB_OUTPUT"
          echo "Опубликовано: ${IMAGE}:latest, ${IMAGE}:${GITHUB_SHA}, ${IMAGE}:${VERSION}"

  # ════════════════════════════════════════════════════════════
  # 7. RELEASE — GitHub Release после публикации (только main)
  # ════════════════════════════════════════════════════════════
  release:
    name: GitHub Release (main)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует — пропускаем"
            exit 0
          fi
          gh release create "$TAG" \
            --target main \
            --title "WalkingRobotSim $TAG" \
            --generate-notes
          BODY=$(gh release view "$TAG" --json body --jq .body)
          gh release edit "$TAG" --notes "${BODY}

          ### Docker image
          - \`${IMAGE}:${TAG}\`
          - \`${IMAGE}:latest\`
          - digest: \`${DIGEST}\`"
