name: CI

on:
  push:
    branches: [ main, jazzy ]
  pull_request:
    branches: [ main, jazzy ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        cd src/docker
        docker build -t walking_robot_sim:test .
        
    - name: Test container
      run: |
        cd src/docker
        docker-compose up -d
        sleep 30
        docker-compose exec -T simulator bash -c "source /opt/ros/jazzy/setup.bash && ros2 node list"
        docker-compose down
