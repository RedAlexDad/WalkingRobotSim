name: CI

on:
  push:
    branches: [ main, jazzy ]
  pull_request:
    branches: [ main, jazzy ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo apt-get clean
        docker system prune -a -f
        df -h
        
    - name: Build Docker image
      run: |
        cd src/docker
        docker build --no-cache -t walking_robot_sim:test .
        
    - name: Test container
      run: |
        cd src/docker
        docker compose up -d
        sleep 30
        docker compose exec -T simulator bash -c "source /opt/ros/jazzy/setup.bash && ros2 node list" > test_results.txt 2>&1
        docker compose logs simulator > container_logs.txt
        docker compose down
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ci-results
        path: |
          src/docker/test_results.txt
          src/docker/container_logs.txt
        retention-days: 7
