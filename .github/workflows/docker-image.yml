name: Publish Docker image

# Публикует собранный образ в GitHub Packages (GHCR), чтобы его можно было
# восстановить без пересборки: `make image-pull` (см. src/docker/README.md).
# Локальный кэш образа (images/*.tar.zst) в git не хранится.
on:
  push:
    branches:
      - main
      - feat/rust-full-migration
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERFILE: src/docker/Dockerfile
  IMAGE_BASENAME: walking_robot_sim

jobs:
  publish:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    # Образ весит ~16 GB: на github-hosted раннере диска мало, поэтому
    # сначала освобождаем место, а сборка идёт с registry-кэшем в GHCR.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Compute image name (lowercase)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_BASENAME}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: final
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Registry-кэш слоёв: переживает перезапуски раннера и не упирается
          # в лимит 10 GB у type=gha.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
