# Ruff configuration for Python linting
# https://docs.astral.sh/ruff/configuration/

line-length = 120
target-version = "py310"

# Исключаем тесты и legacy код
exclude = [
    "src/tests/",
    "src/tests/old/",
    "**/benchmark*.py",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # line too long (handled by formatter)
    "F401",  # imported but unused (common in ROS __init__.py)
    "E741",  # ambiguous variable name (common in math: l, O)
    "F841",  # unused local variable (common in benchmark code)
    "E402",  # module level import not at top (benchmark imports)
    "E722",  # bare except
]

[lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"**/cmd_vel_pub.py" = ["E501"]
