<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200">
  <style>
    .ln { stroke:#14395c; stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .body { fill:#e8eef5; stroke:#14395c; stroke-width:2.6; }
    .box { stroke:#c0392b; stroke-width:2; fill:none; }
    .dash { stroke:#2c5f8a; stroke-width:2; fill:none; stroke-dasharray:5 4; }
    .t { font-family:Georgia,"Times New Roman",serif; font-size:13px; fill:#14395c; }
    .lk { font-family:Georgia,"Times New Roman",serif; font-size:11px; fill:#c0392b; }
  </style>

  <!-- монитор -->
  <rect class="ln" x="18" y="26" width="128" height="84" rx="5"/>
  <line class="ln" x1="82" y1="110" x2="82" y2="128"/>
  <line class="ln" x1="58" y1="128" x2="106" y2="128"/>

  <!-- результат распознавания на экране: рамка + класс + уверенность -->
  <rect class="box" x="40" y="52" width="46" height="40"/>
  <line class="box" x1="40" y1="52" x2="30" y2="42"/>
  <text class="lk" x="18" y="38">стул 0.71</text>
  <text class="t" x="96" y="70">0.71</text>

  <!-- стол -->
  <line class="ln" x1="8" y1="158" x2="452" y2="158"/>

  <!-- оператор: голова, корпус, руки -->
  <circle class="body" cx="360" cy="58" r="17"/>
  <path class="ln" d="M360 75 L360 120"/>
  <path class="ln" d="M360 90 L324 122"/>
  <path class="ln" d="M360 90 L390 118"/>

  <!-- клавиатура -->
  <rect class="ln" x="310" y="132" width="76" height="11" rx="2"/>

  <!-- стрелка «результат → оператор» -->
  <path class="dash" d="M150 68 L333 68"/>
  <path class="dash" d="M333 63 L340 68 L333 73"/>

  <!-- подписи (разнесены) -->
  <text class="t" x="20" y="190">Экран: результат распознавания</text>
  <text class="t" x="330" y="190">Оператор</text>
</svg>
