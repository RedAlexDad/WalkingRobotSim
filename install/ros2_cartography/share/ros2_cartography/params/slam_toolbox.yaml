slam_toolbox:
  ros__parameters:
    mode: mapping # Режим построения карты
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 35.0
    min_laser_range: 0.5
    transform_publish_period: 0.05
    message_filter_queue_size: 100 # Увеличиваем очередь для обработки сообщений
    scan_subscriber_queue_size: 10
