# Определение повторно используемых блоков конфигурации с помощью YAML anchors
# Базовая конфигурация шаблона для сервисов, которым нужен доступ к GUI
x-basic: &basic
  # Разрешить обмен данными между процессами в контейнере и хостом
  ipc: host
  # Включить stdin для интерактивных команд
  stdin_open: true
  # Использовать сетевой стек хоста для прямого доступа к сети хоста
  network_mode: host
  # Выделить псевдо-TTY для интерактивных процессов
  tty: true
  # Предоставить расширенные привилегии контейнеру
  privileged: true
  # Переменные окружения, необходимые для приложений GUI
  environment:
    # Переменная отображения для перенаправления X11
    DISPLAY:
    # Путь к файлу авторизации X для аутентификации
    XAUTHORITY: "/root/.Xauthority"
    # Отключить расширение MIT-SHM для X11 (требуется для Docker)
    QT_X11_NO_MITSHM: "1"
    # Каталог выполнения сеансов пользователя
    XDG_RUNTIME_DIR:
  # Монтировать сокет X11 для перенаправления GUI
  volumes:
    # Монтировать каталог сокета X11 для отображения GUI
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Монтировать файл авторизации X для аутентификации X11
    - ${HOME}/.Xauthority:/root/.Xauthority

# Шаблон переменных окружения для приложений GUI
x-gui_env: &env_gui
  # Переменная отображения X11
  DISPLAY:
  # Путь к файлу авторизации X
  XAUTHORITY: "/root/.Xauthority"
  # Отключить расширение MIT-SHM для совместимости X11
  QT_X11_NO_MITSHM: "1"
  # Каталог для файлов выполнения
  XDG_RUNTIME_DIR:

# Определить сервисы в Docker Compose
services:
  # Определение сервиса симулятора
  simulator:
    # Наследовать базовую конфигурацию из anchor
    <<: *basic
    # Docker-образ для использования в контейнере
    image: walking_robot_sim:latest
    # Имя экземпляра контейнера
    container_name: walking_robot_sim
    # Команда для выполнения при запуске контейнера
    command: bash -c "tail -f /dev/null"
    # Переменные окружения, специфичные для этого сервиса
    environment:
      # Наследовать переменные окружения GUI
      <<: *env_gui
      # Реализация промежуточного ПО ROS2
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      # Путь к ресурсам Gazebo
      GAZEBO_RESOURCE_PATH: "/usr/share/gazebo-11"
      # Путь к ресурсам симуляции Gazebo
      GZ_SIM_RESOURCE_PATH: "/root/ws/src/gazebo_sim/models/"
      # Путь к моделям Gazebo
      GAZEBO_MODEL_PATH: "/usr/share/gazebo-11/models/:/opt/ros/jazzy/share/turtlebot3_gazebo/models/"
      # Путь к файлу конфигурации CycloneDDS
      CYCLONEDDS_URI: file:///cyclonedds.xml
      # ID домена ROS для изоляции сети
      ROS_DOMAIN_ID: 0
      # Каталог рабочей области
      WORKSPACE_DIR: "/root/ws"
      # Каталог журналов ROS
      ROS_LOG_DIR: "/root/ws/logs"
      # Версия дистрибутива ROS
      ROS_DISTRO: jazzy
    # Конфигурация сборки для образа
    build:
      # Каталог контекста сборки (родитель текущего каталога)
      context: ..
      # Путь к Dockerfile
      dockerfile: docker/Dockerfile
      # Аргументы сборки
      args:
        # Базовый образ для сборки
        BASE_IMG: osrf/ros:jazzy-desktop
        # Используемый дистрибутив ROS
        ROS_DISTRO: jazzy
      # Источники кэша для ускорения сборки
      cache_from:
        # Слой базовой системы
        - walking_robot_sim:base-system
        # Слой ядра ROS
        - walking_robot_sim:ros-core
        # Слой управления ROS
        - walking_robot_sim:ros-control
        # Слой симуляции ROS
        - walking_robot_sim:ros-simulation
        # Слой навигации ROS
        - walking_robot_sim:ros-navigation
        # Слой зрения ROS
        - walking_robot_sim:ros-vision
        # Слой инструментов ROS
        - walking_robot_sim:ros-tools
        # Слой зависимостей Python
        - walking_robot_sim:python-deps
        # Слой рабочей области
        - walking_robot_sim:workspace
        # Последний слой
        - walking_robot_sim:latest
      # Целевая стадия сборки для создания
      target: final
    # Тома для монтирования в контейнере
    volumes:
      # Монтировать файл конфигурации CycloneDDS
      - ./cyclonedds.xml:/cyclonedds.xml:ro
      # Монтировать каталог исходного кода (только для чтения)
      - ./../:/root/ws/src/:ro
      # Именованный том для журналов Gazebo
      - gazebo_logs:/root/ws/logs
      # Именованный том для данных Gazebo
      - gazebo_data:/root/ws/data
    # Политика перезапуска для контейнера
    restart: unless-stopped
    # Конфигурация проверки работоспособности
    healthcheck:
      # Команда для выполнения проверки работоспособности
      test:
        [
          "CMD",
          "bash",
          "-c",
          "source /opt/ros/jazzy/setup.bash && source /root/ws/install/setup.bash && ros2 node list",
        ]
      # Интервал между проверками работоспособности
      interval: 30s
      # Время ожидания для каждой проверки работоспособности
      timeout: 10s
      # Количество повторных попыток перед пометкой как неработоспособный
      retries: 3
      # Время ожидания перед началом проверок работоспособности после запуска контейнера
      start_period: 60s

# Определить именованные тома
volumes:
  # Том для журналов Gazebo
  gazebo_logs:
    # Использовать локальный драйвер тома
    driver: local
  # Том для данных Gazebo
  gazebo_data:
    # Использовать локальный драйвер тома
    driver: local