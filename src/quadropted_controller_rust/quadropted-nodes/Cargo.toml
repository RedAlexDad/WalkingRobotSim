[package]
name = "quadropted-nodes"
version = "0.1.0"
edition = "2021"
description = "ROS 2 nodes for Quadropted robot"

[[bin]]
name = "robot_controller_node"
path = "src/bin/robot_controller_node.rs"

[dependencies]
rclrs = "0.7"
rosidl_runtime_rs = "0.6"
nalgebra = "0.33"
quadropted-core = { path = "../quadropted-core" }
geometry_msgs_rs = { path = "../../geometry_msgs_rs" }
quadropted_msgs_rs = { path = "../../quadropted_msgs_rs" }
sensor_msgs_rs = { path = "../../sensor_msgs_rs" }
std_msgs_rs = { path = "../../std_msgs_rs" }
