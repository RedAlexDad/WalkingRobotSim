# Конфигурация для узла slam_toolbox
slam_toolbox:
  ros__parameters:
    # Plugin params (Параметры плагина оптимизации)
    solver_plugin: solver_plugins::CeresSolver # Указывает плагин оптимизации, используемый для решения задачи SLAM (Ceres Solver — мощный решатель для нелинейной оптимизации).
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY # Тип линейного решателя в Ceres (SPARSE_NORMAL_CHOLESKY — метод разложения Холецкого для разреженных матриц).
    ceres_preconditioner: SCHUR_JACOBI # Прекондиционер для Ceres (SCHUR_JACOBI улучшает сходимость для больших систем).
    ceres_trust_strategy: LEVENBERG_MARQUARDT # Стратегия минимизации в Ceres (LEVENBERG_MARQUARDT — адаптивный метод для нелинейной оптимизации).
    ceres_dogleg_type: TRADITIONAL_DOGLEG # Тип шага Dogleg в Ceres (TRADITIONAL_DOGLEG — стандартный метод для управления шагами оптимизации).
    ceres_loss_function: None # Функция потерь для Ceres (None — без функции потерь, минимизация без подавления выбросов).

    # ROS Parameters (Параметры ROS)
    odom_frame: odom # Имя фрейма одометрии, используемого для отслеживания движения робота (обычно "odom").
    map_frame: map # Имя фрейма карты, в которой строится глобальная карта (обычно "map").
    base_frame: base_link # Имя базового фрейма робота (обычно "base_link" — центр робота).
    scan_topic: /scan # Топик, с которого считываются данные лидара (в данном случае /scan для сообщений sensor_msgs/LaserScan).
    mode: mapping # Режим работы SLAM (mapping — построение карты; можно переключить на localization для использования готовой карты).

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    # map_file_name: test_steve  # Имя файла карты для загрузки или сохранения (закомментировано, не используется).
    # map_start_pose: [0.0, 0.0, 0.0]  # Начальная поза робота [x, y, yaw] для продолжения карты (закомментировано, не используется).
    # map_start_at_dock: true  # Начинать построение карты с позиции "дока" (закомментировано, не используется).

    debug_logging: true # Включает отладочные сообщения в логах (true — выводит подробную информацию для диагностики).
    throttle_scans: 1 # Ограничение количества обрабатываемых сканов лидара (1 — обрабатывается каждый скан).
    transform_publish_period: 0.02 # Период публикации трансформаций (TF) между фреймами (0.02 с = 50 Гц; если 0, то не публикуется).
    map_update_interval: 5.0 # Интервал обновления карты в секундах (5.0 с — карта обновляется каждые 5 секунд).
    resolution: 0.05 # Разрешение карты в метрах на клетку (0.05 м — размер одной ячейки сетки).
    max_laser_range: 20.0 # Максимальная дальность лидара для растеризации карты (5.0 м).
    minimum_time_interval: 0.5 # Минимальный интервал времени между обработкой сканов (0.5 с).
    transform_timeout: 0.2 # Таймаут ожидания трансформаций (0.2 с — максимальное время ожидания TF).
    tf_buffer_duration: 30. # Длительность хранения буфера трансформаций в секундах (30 с).
    stack_size_to_use: 100000000 # Размер стека программы (100 МБ, необходимо для сериализации больших карт).
    enable_interactive_mode: true # Включает интерактивный режим для управления SLAM (например, через RViz).

    # General Parameters (Общие параметры)
    use_scan_matching: true # Включает сопоставление сканов лидара для улучшения локализации (true — использует scan matching).
    use_scan_barycenter: true # Учитывает барицентр скана лидара для вычисления позиции (true — включает эту функцию).
    minimum_travel_distance: 0.5 # Минимальное расстояние перемещения робота для добавления нового узла в граф SLAM (0.5 м).
    minimum_travel_heading: 0.5 # Минимальное изменение угла поворота робота для добавления узла (0.5 радиан ≈ 28.6°).
    scan_buffer_size: 10 # Размер буфера для хранения сканов лидара (10 сканов).
    scan_buffer_maximum_scan_distance: 10.0 # Максимальная дистанция для сканов в буфере (10 м).
    link_match_minimum_response_fine: 0.1 # Минимальный отклик для точного соответствия звеньев (0.1 — порог для scan matching).
    link_scan_maximum_distance: 1.5 # Максимальная дистанция для соответствия звеньев (1.5 м).
    loop_search_maximum_distance: 3.0 # Максимальная дистанция для поиска замыкания цикла (3.0 м).
    do_loop_closing: true # Включает замыкание цикла для коррекции карты (true — активирует loop closure).
    loop_match_minimum_chain_size: 10 # Минимальное количество узлов в цепочке для замыкания цикла (10 узлов).
    loop_match_maximum_variance_coarse: 3.0 # Максимальная дисперсия для грубого соответствия при замыкании цикла (3.0).
    loop_match_minimum_response_coarse: 0.35 # Минимальный отклик для грубого соответствия при замыкании цикла (0.35).
    loop_match_minimum_response_fine: 0.45 # Минимальный отклик для точного соответствия при замыкании цикла (0.45).

    # Correlation Parameters - Correlation Parameters (Параметры корреляции)
    correlation_search_space_dimension: 0.5 # Размер пространства поиска для корреляции сканов (0.5 м).
    correlation_search_space_resolution: 0.01 # Разрешение пространства поиска для корреляции (0.01 м).
    correlation_search_space_smear_deviation: 0.1 # Отклонение сглаживания для корреляции сканов (0.1 м).

    # Correlation Parameters - Loop Closure Parameters (Параметры замыкания цикла)
    loop_search_space_dimension: 8.0 # Размер пространства поиска для замыкания цикла (8.0 м).
    loop_search_space_resolution: 0.05 # Разрешение пространства поиска для замыкания цикла (0.05 м).
    loop_search_space_smear_deviation: 0.03 # Отклонение сглаживания для замыкания цикла (0.03 м).

    # Scan Matcher Parameters (Параметры сопоставления сканов)
    distance_variance_penalty: 0.5 # Штраф за дисперсию расстояния при сопоставлении сканов (0.5).
    angle_variance_penalty: 1.0 # Штраф за дисперсию угла при сопоставлении сканов (1.0).
    fine_search_angle_offset: 0.00349 # Смещение угла для точного поиска (0.00349 радиан ≈ 0.2°).
    coarse_search_angle_offset: 0.349 # Смещение угла для грубого поиска (0.349 радиан ≈ 20°).
    coarse_angle_resolution: 0.0349 # Разрешение угла для грубого поиска (0.0349 радиан ≈ 2°).
    minimum_angle_penalty: 0.9 # Минимальный штраф за угол при сопоставлении (0.9).
    minimum_distance_penalty: 0.5 # Минимальный штраф за расстояние при сопоставлении (0.5).
    use_response_expansion: true # Включает расширение отклика для улучшения сопоставления (true — активирует).
